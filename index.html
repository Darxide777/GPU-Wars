<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>GPU Wars</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05010f; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: 'DejaVu Sans Mono', Consolas, monospace; color: #bdf7ff; user-select: none; }
    canvas { position: fixed; inset: 0; display: block; touch-action: none; }
    #fs { display: none; position: fixed; top: 8px; right: 8px; z-index: 5; width: 38px; height: 34px; padding: 0; font-size: 18px; line-height: 1; opacity: .75; }
    #fs:hover { opacity: 1; }
    h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: .2em; color: #ff2bd6; text-shadow: 0 0 12px #ff2bd6; }
    h2 { margin: 16px 0 6px; font-size: 13px; letter-spacing: .25em; color: #21e6ff; }
    p { margin: 4px 0; font-size: 12px; color: #8a9ac0; } p.help { margin-top: 14px; color: #6a7aa0; line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 5px 0; font-size: 12px; } .row > span { min-width: 190px; color: #8a9ac0; }
    .row input[type=range] { flex: 1; min-width: 120px; accent-color: #ff2bd6; } .row b { min-width: 42px; text-align: right; color: #ffe14d; }
    #screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5,1,15,.62); }
    .card { touch-action: pan-y; width: min(560px, 92vw); max-height: 92vh; overflow: auto; padding: 16px 20px; background: rgba(8,3,22,.95); border: 2px solid #ff2bd6; box-shadow: 0 0 30px rgba(255,43,214,.45); }
    .card h1 { font-size: clamp(20px, 2.4vw, 28px); letter-spacing: .24em; margin: 0 0 2px; } .card .sub { font-size: 12px; letter-spacing: .1em; color: #8a9ac0; margin: 0 0 10px; min-height: 1.2em; }
    .opt { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 10px; margin: 2px 0; scroll-margin: 8px 0; border: 1px solid #3a1a5a; background: rgba(10,4,26,.7); cursor: pointer; font-size: clamp(12px, 1.3vw, 14px); letter-spacing: .14em; color: #8a7aaa; transition: border-color .1s, box-shadow .1s; }
    .opt em b { padding: 0 5px; cursor: pointer; } .opt em b:hover { color: #21e6ff; } .opt em { font-style: normal; color: #ffe14d; letter-spacing: .12em; } .opt.off { opacity: .4; cursor: default; }
    .opt.sel { border-color: #21e6ff; color: #21e6ff; box-shadow: 0 0 16px #21e6ff, inset 0 0 14px rgba(255,255,255,.05); text-shadow: 0 0 10px #21e6ff; }
    #hint { min-height: 2.2em; margin: 8px 2px 0; font-size: 11px; letter-spacing: .06em; color: #bdf7ff; opacity: .85; line-height: 1.3; }
    table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; font-size: 12px; letter-spacing: .08em; } th { text-align: right; color: #21e6ff; font-weight: normal; padding: 2px 5px; font-size: 11px; letter-spacing: .2em; } th:first-child, td:first-child { text-align: left; }
    td { text-align: right; padding: 3px 5px; color: #8a9ac0; border-top: 1px solid #2a1a4a; } tr.me td { color: #ffe14d; } tr.win td:first-child::after { content: '  WINNER'; color: #34ff7a; font-size: 11px; }
    .stats { color: #bdf7ff; font-size: 12px; letter-spacing: .08em; line-height: 1.5; margin: 2px 0 6px; }
    button { font: inherit; font-size: 12px; letter-spacing: .08em; color: #bdf7ff; background: #120838; border: 1px solid #3a1a5a; padding: 4px 8px; cursor: pointer; }
    button:hover { border-color: #21e6ff; } button.on { color: #05010f; background: #21e6ff; border-color: #21e6ff; } button.go { margin-left: auto; color: #05010f; background: #ffe14d; border-color: #ffe14d; font-weight: bold; }
    .tabs { display: flex; gap: 6px; margin: 0 0 8px; } .tabs:empty { display: none; }
    .info p { margin: 4px 0 8px; font-size: 12px; color: #bdf7ff; line-height: 1.5; } .info .taunt { color: #ff2bd6; font-style: italic; font-size: 14px; margin: 6px 0 10px; }
    .card.wide { width: min(920px, 94vw); } .rows-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; } .dyno { display: block; max-width: 420px; margin: 0 auto 6px; } .opt small { color: #8a9ac0; font-size: 11px; margin-left: 6px; }
    .slips { display: flex; gap: 16px; } .slips table { flex: 1; } .slips th { text-align: left; } .slips td:first-child { text-align: left; color: #8a9ac0; }
    .lbhead { color: #21e6ff; font-size: 12px; letter-spacing: .2em; margin: 2px 0 4px; }
    .lbscroll { height: min(44vh, 400px); overflow-y: auto; scrollbar-gutter: stable; overscroll-behavior: contain; border: 1px solid #2a1a4a; background: rgba(10,4,26,.5); }
    .lbrow { display: grid; grid-template-columns: 3.5em 1fr 7em 7em; gap: 0 8px; padding: 3px 8px; font-size: 12px; letter-spacing: .08em; color: #8a9ac0; border-top: 1px solid #2a1a4a; }
    .lbscroll.overall .lbrow { grid-template-columns: 3.5em 1fr 7em 7em 7.5em; } .lbrow .c { display: none; } .lbscroll.overall .lbrow .c { display: block; }
    .lbrow > :nth-child(n+3) { text-align: right; } .lbrow > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lbrow.me { color: #ffe14d; background: rgba(255,225,77,.1); }
    .lbcols { position: sticky; top: 0; z-index: 1; background: #0a0420; color: #21e6ff; font-size: 11px; letter-spacing: .2em; border-top: 0; }
    .lbmsg { padding: 28px 12px; text-align: center; color: #bdf7ff; font-size: 12px; letter-spacing: .12em; line-height: 1.6; } .lbmsg b { display: block; color: #ff2bd6; font-size: 14px; }
    .lbfoot { min-height: 1.4em; margin: 4px 2px 6px; font-size: 11px; letter-spacing: .1em; color: #ffe14d; }
    .pts { color: #ffe14d; font-size: 13px; letter-spacing: .1em; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <button id="fs" type="button" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
  <div id="screen"><div class="card"><h1 id="title"></h1><p class="sub" id="sub"></p><div id="tabs"></div><div id="extra"></div><div id="rows"></div><p class="hint" id="hint"></p></div></div>
  <script src="dist/gpuwars.js"></script>
</body>
</html>
